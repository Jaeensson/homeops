---
when:
  - event: cron
    cron: renovate
  - event: manual
steps:
  - name: renovate
    image: ghcr.io/renovatebot/renovate:latest@sha256:8017d963be4b849afc9503471c836d44c4953e6049b7ce55187855bfe570bf96
    environment:
      RENOVATE_PLATFORM: forgejo
      RENOVATE_ENDPOINT: https://codeberg.org/api/v1
      RENOVATE_REPOSITORIES: Jaeensson/homeops
      RENOVATE_TOKEN:
        from_secret: renovate_token
      GITHUB_TOKEN:
        from_secret: github_token
      LOG_LEVEL: info
