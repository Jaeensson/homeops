---
when:
  - event: cron
    cron: renovate
  - event: manual
steps:
  - name: renovate
    image: ghcr.io/renovatebot/renovate:latest@sha256:539b0ce5f22bcd4b0a42681c0c984afd1c293e2ce5bb12bcb4c01e0f608d60c9
    environment:
      RENOVATE_PLATFORM: forgejo
      RENOVATE_ENDPOINT: https://codeberg.org/api/v1
      RENOVATE_REPOSITORIES: Jaeensson/homeops
      RENOVATE_TOKEN:
        from_secret: renovate_token
      RENOVATE_GITHUB_COM_TOKEN:
        from_secret: github_token
      LOG_LEVEL: info
