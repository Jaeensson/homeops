---
when:
  - event: cron
    cron: renovate
  - event: manual
variables:
  log_level: info
steps:
  - name: renovate
    image: ghcr.io/renovatebot/renovate:latest@sha256:d1b1aea93ec23c76023c34a77d5ea5dc2f8e531891ee9cef29c13fdbedf69dc2
    environment:
      RENOVATE_PLATFORM: forgejo
      RENOVATE_ENDPOINT: https://codeberg.org/api/v1
      RENOVATE_REPOSITORIES: Jaeensson/homeops
      RENOVATE_TOKEN:
        from_secret: renovate_token
      RENOVATE_GITHUB_COM_TOKEN:
        from_secret: github_token
      LOG_LEVEL: ${log_level}
