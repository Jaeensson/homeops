---
when:
  - event: cron
    cron: renovate
  - event: manual

variables:
  log_level: info
steps:
  - name: generate-token
    image: ghcr.io/yyewolf/woodpecker-plugins/github-app-token:latest
    environment:
      PLUGIN_GITHUB_APP_ID:
        from_secret: renovate_app_id
      PLUGIN_GITHUB_PRIVATE_KEY_PEM:
        from_secret: renovate_private_key
      PLUGIN_GITHUB_INSTALLATION_ID:
        from_secret: renovate_installation_id
      PLUGIN_OUTPUT_FILE: .github_token
  - name: renovate
    image: ghcr.io/renovatebot/renovate:latest@sha256:fb9b7b988bd60c428d943ab59a2e31b6565588a550c348a289b06bd65d3e0061
    environment:
      RENOVATE_PLATFORM: github
      RENOVATE_REPOSITORIES: Jaeensson/homeops
      RENOVATE_USERNAME:
        from_secret: renovate_username
      RENOVATE_GIT_AUTHOR:
        from_secret: renovate_git_author
      RENOVATE_GITHUB_COM_TOKEN:
        from_secret: github_token
      LOG_LEVEL: ${log_level}
    commands:
      - export RENOVATE_TOKEN=$(cat .github_token)
      - renovate
