when:
  - event: cron
    cron: renovate
  - event: manual
steps:
  - name: renovate
    image: ghcr.io/renovatebot/renovate:latest
    environment:
      RENOVATE_PLATFORM: forgejo
      RENOVATE_ENDPOINT: https://codeberg.org/api/v1
      RENOVATE_REPOSITORIES: Jaeensson/homeops
      RENOVATE_TOKEN:
        from_secret: renovate_token
      GITHUB_TOKEN:
        from_secret: github_token
      LOG_LEVEL: info
