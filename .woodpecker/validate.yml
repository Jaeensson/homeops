---
when:
  - event: push
    branch:
      - renovate/**

steps:
  - name: validate-renovate-config
    image: ghcr.io/renovatebot/renovate:44.7.2
    commands:
      - renovate-config-validator --strict .renovaterc.json5

  - name: check-yaml-format
    image: ghcr.io/google/yamlfmt:0.21.0
    commands:
      - yamlfmt -verbose -lint kubernetes/

  - name: terraform-lint
    image: ghcr.io/terraform-linters/tflint:v0.64.0
    commands:
      - tflint --chdir terraform --recursive

  - name: flate-test
    image: ghcr.io/home-operations/flate:0.4.12
    commands:
      - flate test all --path kubernetes/flux/
