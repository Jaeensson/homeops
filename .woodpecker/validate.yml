---
when:
  - event: push

steps:
  - name: validate-renovate-config
    image: ghcr.io/renovatebot/renovate:latest
    commands:
      - renovate-config-validator --strict .renovaterc.json5

  - name: check-yaml-format
    image: ghcr.io/google/yamlfmt:0.21.0
    commands:
      - yamlfmt -verbose -lint kubernetes/

  - name: terraform-lint
    image: ghcr.io/terraform-linters/tflint:v0.64.0
    commands:
      - tflint --chdir terraform --recursive

  - name: flate-test
    image: alpine:latest
    # woodpecker-cache PVC: persists flate's on-disk cache (OCI chart blobs,
    # git mirrors, helm render output) across runs so ghcr is not re-fetched
    # on every push (avoids shared-egress-IP rate limiting)
    volumes:
      - woodpecker-cache:/cache
    commands:
      - apk add --no-cache curl
      - |
        # renovate: datasource=github-releases depName=home-operations/flate
        FLATE_VERSION="0.6.1"
        # $$ escapes envsubst so the shell variable survives Woodpecker's YAML preprocessing
        curl -fsSL "https://github.com/home-operations/flate/releases/download/v$${FLATE_VERSION}/flate_$${FLATE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
      - flate test ks --path kubernetes/flux/ --cache-dir /cache/flate
