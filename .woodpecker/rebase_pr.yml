---
when:
  - event: push
    branch: main

# The rebase job needs full history (to compute merge-bases and rebase branches
# onto main). The default clone is partial (depth=1, --filter=tree:0), which
# makes `git rebase` find no merge-base and replay the entire branch history.
clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false

steps:
  - name: generate-token
    image: ghcr.io/yyewolf/woodpecker-plugins/github-app-token:1.2.3
    environment:
      PLUGIN_GITHUB_APP_ID:
        from_secret: renovate_app_id
      PLUGIN_GITHUB_PRIVATE_KEY_PEM:
        from_secret: renovate_private_key
      PLUGIN_GITHUB_INSTALLATION_ID:
        from_secret: renovate_installation_id
      PLUGIN_OUTPUT_FILE: .github_token

  - name: rebase-renovate-branches
    image: alpine:latest
    environment:
      GITHUB_REPOSITORY: Jaeensson/homeops
      BASE_BRANCH: main
      GH_APP_NAME:
        from_secret: gh_app_name
      GH_APP_EMAIL:
        from_secret: gh_app_email
    commands:
      - export GH_TOKEN=$(cat .github_token)
      - apk add --no-cache git jq bash github-cli

      - git config --global user.name "$${GH_APP_NAME}"
      - git config --global user.email "$${GH_APP_EMAIL}"

      # Authenticate git
      - git remote set-url origin "https://x-access-token:$${GH_TOKEN}@github.com/$${GITHUB_REPOSITORY}.git"

      - git fetch origin "$${BASE_BRANCH}"
      - git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      # Get ONLY renovate/* branches with open PRs
      - |
        gh pr list \
          --repo "$${GITHUB_REPOSITORY}" \
          --state open \
          --base "$${BASE_BRANCH}" \
          --json headRefName,isDraft \
          --jq '.[]
            | select(.isDraft == false)
            | select(.headRefName | startswith("renovate/"))
            | .headRefName' \
          > renovate-branches.txt

      - echo "Renovate branches to process:"
      - cat renovate-branches.txt || true

      # Rebase each renovate branch
      - |-
        while read -r branch; do
          if [ -z "$branch" ]; then
            continue
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Rebasing $branch"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━"

          git checkout -B "$branch" "origin/$branch"

          if git rebase "origin/$BASE_BRANCH"; then
            git push --force-with-lease origin "$branch"
          else
            echo "Rebase failed for $branch, skipping"
            git rebase --abort || true
          fi
        done < renovate-branches.txt
