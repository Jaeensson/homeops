---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  values:
    fullnameOverride: renovate-operator
    route:
      enabled: true
      hostnames:
        - renovate.egenintres.se
      parentRefs:
        - name: envoy-gateway-local
          namespace: network
          sectionName: https
    webhook:
      enabled: true
      route:
        enabled: true
        hostnames:
          - renovate-wh.egenintres.se
        parentRefs:
          - name: envoy-gateway-local
            namespace: network
            sectionName: https
          - name: envoy-gateway-public
            namespace: network
            sectionName: https
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
