# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-default-agent-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: woodpecker-default-agent-secret
  data:
    - secretKey: WOODPECKER_FORGEJO_CLIENT
      remoteRef:
        key: /woodpecker/WOODPECKER_FORGEJO_CLIENT
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: WOODPECKER_FORGEJO_SECRET
      remoteRef:
        key: /woodpecker/WOODPECKER_FORGEJO_SECRET
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: WOODPECKER_AGENT_SECRET
      remoteRef:
        key: /woodpecker/WOODPECKER_AGENT_SECRET
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
