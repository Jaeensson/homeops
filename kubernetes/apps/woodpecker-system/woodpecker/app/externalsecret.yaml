---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-default-agent-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: woodpecker-default-agent-secret
    creationPolicy: Owner
  data:
    - secretKey: WOODPECKER_GITHUB_CLIENT
      remoteRef:
        key: /woodpecker/WOODPECKER_GITHUB_CLIENT
    - secretKey: WOODPECKER_GITHUB_SECRET
      remoteRef:
        key: /woodpecker/WOODPECKER_GITHUB_SECRET
    - secretKey: WOODPECKER_AGENT_SECRET
      remoteRef:
        key: /woodpecker/WOODPECKER_AGENT_SECRET
