---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: woodpecker
  namespace: woodpecker-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/woodpecker-system/woodpecker/app
  prune: true
  components:
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: woodpecker-server
      VOLSYNC_CAPACITY: 2Gi
