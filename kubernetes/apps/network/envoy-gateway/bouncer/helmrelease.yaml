---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-proxy-bouncer
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: envoy-proxy-bouncer
  values:
    config:
      server:
        logLevel: "info"
      bouncer:
        enabled: true
        lapiURL: "http://crowdsec-service.network.svc.cluster.local:8080"
        apiKeySecretRef:
          name: envoy-proxy-bouncer
          key: apiKey
        tickerInterval: "10s"
        metrics: false
      trustedProxies:
        - "10.42.0.0/16"
      prometheus:
        enabled: false
      captcha:
        enabled: false
      waf:
        enabled: false

    referenceGrant:
      create: true
      fromNamespaces:
        - default
        - monitoring
        - woodpecker-system
