---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: &name pihole
  values:
    controllers:
      pihole:
        containers:
          app:
            image:
              repository: ghcr.io/pi-hole/pihole
              tag: 2026.06.0@sha256:8ea95136e7c8c15b42d88eadf1a3875421aa1be30ad39e50f661188cc986fb27
            env:
              - name: TZ
                value: Europe/Stockholm
              - name: PIHOLE_UID
                value: "0"
              - name: PIHOLE_GID
                value: "0"
              - name: DNSMASQ_USER
                value: root
            envFrom:
              - secret: *name
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_ADMIN
                  - SYS_TIME
                  - SYS_NICE
                  - SETGID
                  - SETUID
                  - CHOWN
    service:
      app:
        controller: *name
        ports:
          http:
            port: 80
      dns:
        annotations:
          metallb.io/loadBalancerIPs: 192.168.2.1
        controller: *name
        type: LoadBalancer
        ports:
          dns-tcp:
            port: 53
            protocol: TCP
          dns-udp:
            port: 53
            protocol: UDP
    persistence:
      config:
        existingClaim: *name
        globalMounts:
          - path: /etc/pihole
