---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-remote
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: external-dns
  values:
    provider:
      name: cloudflare
    sources:
      - gateway-httproute
    # Only sync HTTPRoutes annotated with external-dns.alpha.kubernetes.io/remote-enabled: "true"
    annotationFilter: external-dns.alpha.kubernetes.io/remote-enabled=true
    policy: upsert-only
    registry: noop
    domainFilters:
      - egenintres.se
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: CLOUDFLARE_API_TOKEN
