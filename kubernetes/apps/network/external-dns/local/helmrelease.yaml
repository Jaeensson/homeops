---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-local
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: external-dns
  values:
    provider:
      name: pihole
    sources:
      - gateway-httproute
    policy: sync
    registry: noop
    domainFilters:
      - lab.egenintres.se
    annotationFilter: external-dns.alpha.kubernetes.io/remote-enabled notin (true)
    extraArgs:
      pihole-server: http://pihole-app.network.svc.cluster.local
      pihole-api-version: "6"
    env:
      - name: EXTERNAL_DNS_PIHOLE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: pihole
            key: FTLCONF_webserver_api_password
