---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: crowdsec
  values:
    container_runtime: containerd
    agent:
      acquisition:
        - namespace: network
          podName: envoy-network-envoy-gateway-*
          program: yanis-kouidri/envoy-logs
          poll_without_inotify: true
      env:
        - name: COLLECTIONS
          value: "yanis-kouidri/envoy"
    lapi:
      env:
        - name: ENROLL_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec
              key: ENROLL_KEY
        - name: ENROLL_INSTANCE_NAME
          valueFrom:
            secretKeyRef:
              name: crowdsec
              key: ENROLL_INSTANCE_NAME
        - name: ENROLL_TAGS
          value: "k8s linux prod"
    config:
      config.yaml.local: |-
        api:
          client:
            # the log processor will remove delete itself from LAPI when stopping.
            unregister_on_exit: true
          server:
            # This is needed for agent autoregistration
            auto_registration: # Activate if not using TLS for authentication
              enabled: true
              token: "${REGISTRATION_TOKEN}" # /!\ Do not modify this variable (auto-generated and handled by the chart)
              allowed_ranges: # /!\ Make sure to adapt to the pod IP ranges used by your cluster
                - "127.0.0.1/32"
                - "192.168.0.0/22"
                - "10.42.0.0/24"
                - "10.43.0.0/16"

