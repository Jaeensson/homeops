---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vaultwarden-database
  namespace: default
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/default/vaultwarden/database
  prune: true
  components:
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: vaultwarden-database
      VOLSYNC_SCHEDULE: "02 3 * * *"
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_RUNASUSER: "999"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vaultwarden
  namespace: default
spec:
  dependsOn:
    - name: vaultwarden-database
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/default/vaultwarden/app
  prune: true
  components:
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: vaultwarden
      VOLSYNC_SCHEDULE: "51 3 * * *"
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_RUNASUSER: "1000"

