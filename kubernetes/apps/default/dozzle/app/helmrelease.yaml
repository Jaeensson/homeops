---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dozzle
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: dozzle
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
    controllers:
      dozzle:
        serviceAccount:
          name: pod-viewer
        containers:
          app:
            image:
              repository: amir20/dozzle
              tag: v11.4.3@sha256:244f218c876d6ed766277e71a537f34bfb2c01829e1927737e3673a8327deeb8
            env:
              DOZZLE_MODE: k8s
    service:
      app:
        controller: dozzle
        ports:
          http:
            port: 8080
