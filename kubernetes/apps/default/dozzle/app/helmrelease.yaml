---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dozzle
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: dozzle
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
    controllers:
      dozzle:
        serviceAccount:
          name: pod-viewer
        containers:
          app:
            image:
              repository: amir20/dozzle
              tag: v11.1.2@sha256:55204b375a03c92310d79b659b66217bd38f5675b361e2b5e7b4a03139bbb077
            env:
              DOZZLE_MODE: k8s
    service:
      app:
        controller: dozzle
        ports:
          http:
            port: 8080
