---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: jellyfin
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: jellyfin
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: jellyfin
              spec:
                template:
                  spec:
                    securityContext:
                      devices:
                        - hostPath: /dev/dri/renderD128
                          containerPath: /dev/dri/renderD128
                          permissions: rw
                        - hostPath: /dev/dri/card1
                          containerPath: /dev/dri/card1
                          permissions: rw
  values:
    controllers:
      jellyfin:
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups:
              - 44
              - 990
        containers:
          app:
            image:
              repository: jellyfin/jellyfin
              tag: 10.11.11
            env:
              - name: TZ
                value: Europe/Stockholm
            resources:
              limits:
                memory: 6Gi
    service:
      app:
        controller: jellyfin
        ports:
          http:
            port: 8096
    persistence:
      config:
        existingClaim: jellyfin
        globalMounts:
          - path: /config
      cache:
        type: emptyDir
        globalMounts:
          - path: /cache
      media:
        existingClaim: media
        globalMounts:
          - path: /media
      dri:
        type: hostPath
        hostPath: /dev/dri
        globalMounts:
          - path: /dev/dri
