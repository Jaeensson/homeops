---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant-database
  namespace: default
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/default/home-assistant/database
  prune: true
  components:
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: home-assistant-database
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_RUNASUSER: "999"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
  namespace: default
spec:
  dependsOn:
    - name: home-assistant-database
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/default/home-assistant/app
  prune: true
  components:
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: home-assistant
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_RUNASUSER: "1000"
