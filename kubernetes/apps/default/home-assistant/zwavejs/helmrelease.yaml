---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app zwavejs
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      zwavejs:
        containers:
          app:
            image:
              repository: zwavejs/zwave-js-ui
              tag: 11.19.1
            env:
              - name: TZ
                value: Europe/Stockholm
            securityContext:
              privileged: true
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8091
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /usr/src/app/store
      serial:
        type: hostPath
        hostPath: /dev/serial/by-id/usb-0658_0200-if00
        globalMounts:
          - path: /dev/ttyACM0
