---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: home-assistant-database-secret
    creationPolicy: Owner
  data:
    - secretKey: MARIADB_ROOT_PASSWORD
      remoteRef:
        key: /home-assistant/MARIADB_ROOT_PASSWORD
    - secretKey: MARIADB_PASSWORD
      remoteRef:
        key: /home-assistant/MARIADB_PASSWORD
    - secretKey: MARIADB_DATABASE
      remoteRef:
        key: /home-assistant/MARIADB_DATABASE
    - secretKey: MARIADB_USER
      remoteRef:
        key: /home-assistant/MARIADB_USER
