---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app zigbee2mqtt
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      zigbee2mqtt:
        containers:
          app:
            image:
              repository: ghcr.io/koenkk/zigbee2mqtt
              tag: 2.11.0
            env:
              - name: TZ
                value: Europe/Stockholm
                # TODO: Add serial device passthrough for Zigbee coordinator
                # pod:
                #   securityContext:
                #     privileged: true
                # persistence:
                #   serial:
                #     type: hostPath
                #     hostPath: /dev/serial/by-id/USB_DEVICE_ID
                #     globalMounts:
                #       - path: /dev/ttyACM0
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /app/data
