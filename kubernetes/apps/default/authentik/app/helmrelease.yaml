---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: authentik
  values:
    global:
      envFrom:
        - secretRef:
            name: authentik-secret
    server:
      route:
        main:
          enabled: true
          parentRefs:
            - name: envoy-gateway-local
              namespace: network
              sectionName: https
            - name: envoy-gateway-public
              namespace: network
              sectionName: https
          hostnames:
            - "auth.egenintres.se"
    postgresql:
      enabled: true
      auth:
        enablePostgresUser: false
        username: authentik
        database: authentik
        existingSecret: authentik-secret
        secretKeys:
          userPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
      primary:
        persistence:
          existingClaim: authentik

