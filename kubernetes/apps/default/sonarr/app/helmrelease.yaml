---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sonarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      sonarr:
        pod:
          dnsConfig:
            options:
              - name: ndots
                value: "1"
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/sonarr
              tag: 4.0.17.2952-ls312
            env:
              - name: TZ
                value: Europe/Stockholm
              - name: PUID
                value: "1000"
              - name: PGID
                value: "1000"
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8989
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      downloads:
        existingClaim: downloads
        globalMounts:
          - path: /downloads
      media:
        existingClaim: media
        globalMounts:
          - path: /media
