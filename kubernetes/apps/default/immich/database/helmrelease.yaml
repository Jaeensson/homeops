---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-database
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: immich-database
  values:
    controllers:
      immich-database:
        containers:
          app:
            image:
              repository: pgvector/pgvector
              tag: 0.8.2-pg17-trixie
            env:
              - name: POSTGRES_USER
                value: immich
              - name: POSTGRES_DB
                value: immich
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: immich-secret
                    key: DB_PASSWORD
    service:
      app:
        controller: immich-database
        ports:
          postgres:
            port: 5432
    persistence:
      data:
        existingClaim: immich-database
        globalMounts:
          - path: /var/lib/postgresql/data
