---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-database
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: immich-database
  values:
    controllers:
      immich-database:
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/postgres
              tag: 16-vectorchord0.4.3-pgvectors0.2.0
            env:
              - name: POSTGRES_USER
                value: immich
              - name: POSTGRES_DB
                value: immich
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: immich-secret
                    key: DB_PASSWORD
    service:
      app:
        controller: immich-database
        ports:
          postgres:
            port: 5432
    persistence:
      data:
        existingClaim: immich-database
        globalMounts:
          - path: /var/lib/postgresql/data
