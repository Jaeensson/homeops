---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seerr
  namespace: default
spec:
  dependsOn:
    - name: media
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/default/seerr/app
  prune: true
  components:
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: seerr
      VOLSYNC_SCHEDULE: "23 1 * * *"
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_RUNASUSER: "1000"

